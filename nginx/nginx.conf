# --- Added required 'events' block ---
events {
    worker_connections 1024; # Standard default
}

# --- Added required 'http' block wrapper ---
http {
    # Allow larger multipart/form-data requests (multi-photo uploads)
    client_max_body_size 64M;

    # This block defines our Flask app
    upstream flask_app {
        # 'web' is the service name from docker-compose.yml
        # '8080' is the internal port it runs on
        server web:8080;
    }

    # --- HTTPS Server Block ---
    # This is the main server that handles secure traffic
    server {
        listen 443 ssl;
        client_max_body_size 64M;

        # --- UPDATED: Universal Catch-All ---
        server_name _;

        # --- SSL Certificate Location ---
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        
        # --- SSL Settings ---
        ssl_protocols TLSv1.2 TLSv1.3;
        # --- (REMOVED problematic 'ssl_ciphers' line) ---

        # If a plain HTTP request is sent to HTTPS port (like when clicking Docker Desktop's port link), redirect to HTTPS.
        error_page 497 =301 https://$host:$server_port$request_uri;

        # --- Pass all traffic to our Flask App ---
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- Redirect HTTP to HTTPS ---
    # This block catches any 'http' requests (port 80)
    server {
        listen 80;

        # --- UPDATED: Universal Catch-All ---
        server_name _;
        
        # Send all traffic to the https version
        return 301 https://$host$request_uri;
    }

}