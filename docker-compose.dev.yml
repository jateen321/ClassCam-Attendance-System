services:
  web:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      APP_ENV: development
      DB_HOST: db
    command: ["flask", "--app", "app", "run", "--host=0.0.0.0", "--port=8080", "--debug"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./static_data:/app/static

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  adminer:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-myuser@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-mypassword}
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev:
